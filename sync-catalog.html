<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Catalog Sync — Azam Reka Admin</title>
  <link rel="icon" href="assets/logo.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 100%;
      padding: 2.5rem;
    }
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .header img {
      height: 50px;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.75rem;
      color: #222;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      font-weight: 500;
      color: #333;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }
    input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #333;
      box-shadow: 0 0 0 3px rgba(0,0,0,0.05);
    }
    .button {
      width: 100%;
      padding: 0.875rem;
      background: #333;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .button:hover:not(:disabled) {
      background: #000;
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }
    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status {
      margin-top: 2rem;
      padding: 1rem;
      border-radius: 8px;
      text-align: center;
      font-size: 0.95rem;
      display: none;
    }
    .status.loading {
      display: block;
      background: #e3f2fd;
      color: #1976d2;
      border: 1px solid #90caf9;
    }
    .status.success {
      display: block;
      background: #e8f5e9;
      color: #388e3c;
      border: 1px solid #81c784;
    }
    .status.error {
      display: block;
      background: #ffebee;
      color: #d32f2f;
      border: 1px solid #ef5350;
    }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(0,0,0,0.2);
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 0.5rem;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .info {
      margin-top: 2rem;
      padding: 1rem;
      background: #f5f5f5;
      border-radius: 8px;
      font-size: 0.85rem;
      color: #666;
      line-height: 1.6;
    }
    .info-title {
      font-weight: 600;
      color: #333;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <img src="assets/logo.png" alt="Azam Reka">
    <h1>Catalog Sync</h1>
    <p class="subtitle">Update products from Zoho & Google Sheets</p>
  </div>

  <form id="syncForm">
    <div class="form-group">
      <label for="password">Admin Password</label>
      <input
        id="password"
        type="password"
        placeholder="Enter admin password"
        required
        autocomplete="off"
      >
    </div>

    <button type="submit" class="button" id="syncButton">
      Sync Catalog Now
    </button>

    <div id="status" class="status"></div>
  </form>

  <div class="info">
    <div class="info-title">ℹ️ What this does:</div>
    <ul style="margin-left: 1.2rem;">
      <li>Fetches all products from Zoho Books</li>
      <li>Matches images from your Google Sheet</li>
      <li>Updates catalog.html automatically</li>
    </ul>
  </div>
</div>

<script>
  const form = document.getElementById('syncForm');
  const statusEl = document.getElementById('status');
  const syncButton = document.getElementById('syncButton');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const password = document.getElementById('password').value;

    syncButton.disabled = true;
    statusEl.className = 'status loading';
    statusEl.innerHTML = '<span class="spinner"></span>Syncing...';

    try {
      const response = await fetch('/api/admin/sync-catalog', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || 'Sync failed');
      }

      statusEl.className = 'status success';
      statusEl.innerHTML = `✅ ${data.message}<br>Updated ${data.productsCount} products`;
      document.getElementById('password').value = '';

    } catch (error) {
      statusEl.className = 'status error';
      statusEl.innerHTML = `❌ Error: ${error.message}`;
    } finally {
      syncButton.disabled = false;
    }
  });
</script>

</body>
</html>
